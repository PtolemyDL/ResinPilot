[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resinpilot"
version = "0.1.0"
description = "Self-hosted manager for resin (SLA/MSLA) 3D printers: auto-detects printers on your network, tracks prints, and learns exposure settings from your results."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "ResinPilot contributors" }]
keywords = ["3d-printing", "resin", "sla", "msla", "elegoo", "sdcp", "chitubox", "exposure"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Printing",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "PyYAML>=6.0.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pillow>=10.0",
  "websocket-client>=1.7",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "pyinstaller>=6.6"]

[project.scripts]
resinpilot = "resinpilot.cli:main"

[project.entry-points."resinpilot.drivers"]
sdcp = "resinpilot.drivers.sdcp_driver:SdcpDriver"

[project.urls]
Homepage = "https://github.com/PtolemyDL/ResinPilot"
Issues = "https://github.com/PtolemyDL/ResinPilot/issues"

[tool.setuptools.packages.find]
include = ["resinpilot*"]

[tool.setuptools.package-data]
resinpilot = ["data/*.yaml", "assets/**/*", "web/static/*", "web/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
