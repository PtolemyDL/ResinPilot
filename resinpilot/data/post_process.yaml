- id: superflex
  name: 3DMaterials SuperFlex
  resins: [superflex]
  steps:
  - key: dirty
    label: Dirty IPA
    rail: "1′"
    time: 1 min
    detail: Wash basket in the used IPA, 1 minute only. Flexible resin soaks up IPA and swells.
  - key: clean
    label: Clean IPA
    rail: "1′"
    time: 1 min
    detail: Fresh IPA for 1 minute. Keep the total under 5 minutes.
  - key: dry
    label: Dry
    rail: air
    time: fully
    detail: Compressed air, then let it stand until every trace of IPA has evaporated and it is back to size. Leftover IPA leaves it tacky.
  - key: cure
    label: UV cure
    rail: "5′"
    time: 5 min
    detail: Dry part, centre of the turntable, lid on, 5 minutes.
  - key: water
    label: UV in water
    rail: "5′"
    time: 5 min
    detail: Then 5 minutes more fully under clean water in a clear glass. This removes the sticky surface. Done when it is smooth, matte and not tacky; if still tacky, another 5 minutes in water.
  cautions:
  - Too much UV turns it yellow and stiffer, so stop once the surface is not tacky.
  sources:
  - label: 3DMaterials SuperFlex product page and Q&A
    url: https://www.3dmaterials.com/sub/resins.php?page=1&prdcode=2109150009&ptype=view
  - label: 3DMaterials user guide v3.0
    url: https://www.dropbox.com/scl/fi/94fw4lukktsj5epoto3xs/User-Guide-v3.0_241209.pdf
