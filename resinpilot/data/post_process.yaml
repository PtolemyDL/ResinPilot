- id: siraya_sculpt_grey
  name: Siraya Tech Sculpt Grey
  resins: [siraya_sculpt_grey]
  steps:
  - key: dirty
    label: Dirty IPA
    rail: "2′"
    time: 2 min
    detail: Wash basket in the used IPA. Run the wash for 2 minutes.
  - key: clean
    label: Clean IPA
    rail: "1′"
    time: 1 min
    detail: Move the part to the fresh IPA for 1 minute.
  - key: brush
    label: Brush and rinse
    rail: "↻"
    time: until clean
    detail: Brush the surface with a soft brush, then rinse with clean IPA. Repeat until the surface is clean and no longer sticky.
  - key: dry
    label: Air dry
    rail: air
    time: completely
    detail: Let it air dry completely; no IPA may be left before UV. A hair dryer for about 10 minutes speeds it up.
  - key: cure
    label: UV cure
    rail: "10′"
    time: 10 min
    detail: Dry part, centre of the turntable, lid on. 10 minutes for best performance.
  cautions:
  - No more than 5 minutes in alcohol in total, counting every rinse. Longer can crack the surface.
  - Siraya's datasheet lists about 15 minutes of UV. Use 15 for parts that need full heat resistance, and cure dry, not under water.
  sources:
  - label: Siraya Tech Sculpt Grey and Clear datasheet
    url: https://siraya.tech/pages/high-temperature-resistant-sculpt-grey-and-clear-tds
  - label: Siraya Tech Sculpt user guide
    url: https://siraya.tech/pages/sculpt-user-guide

